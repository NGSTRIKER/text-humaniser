[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rewriter-ai"
version = "0.1.0"
description = "A hybrid rule-based and local LLM text humanizer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "spacy>=3.8",
    "nltk>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
rewriter = "humanizer.main:main"
rewriter-ui = "humanizer.web.__main__:main"
rewriter-eval = "humanizer.evaluation:main"
rewriter-learn = "humanizer.learning:main"

[tool.setuptools.packages.find]
include = ["humanizer*"]

[tool.setuptools.package-data]
"humanizer.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a running Ollama instance",
]
